<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMY Trading Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            min-height: 100vh;
        }
        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        h1 {
            font-size: 24px;
            color: #facc15;
        }
        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 5px;
        }
        main {
            padding: 30px 20px;
        }
        .welcome-box {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            border: 1px solid rgba(250, 204, 21, 0.3);
        }
        .btn {
            display: inline-block;
            background: #facc15;
            color: #000;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background: #eab308;
        }
    </style>
</head>
<body>
    <header>
        <h1>NMY Trading Pro</h1>
        <p class="subtitle">Platform Analisis Pasar Cerdas</p>
    </header>

    <main>
        <div class="welcome-box">
            <h2>Selamat Datang! 🎉</h2>
            <p>Halaman beranda aplikasi kita sudah siap.</p>
            <p style="margin-top:10px; font-size:14px; color:#94a3b8;">Pilih pasar untuk mulai melihat grafik dan sinyal AI</p>
            <button class="btn">Mulai Jelajahi</button>
        </div>
    </main>
</body>
</html>
