<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Pasar - NMY Trading Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            min-height: 100vh;
            padding: 30px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 24px;
            color: #facc15;
            margin-bottom: 8px;
        }
        .sub-judul {
            font-size: 15px;
            color: #94a3b8;
        }
        .kontainer {
            max-width: 400px;
            margin: 0 auto;
        }
        .kartu {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(250, 204, 21, 0.25);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: block;
        }
        .kartu:hover {
            border-color: #facc15;
            transform: translateY(-2px);
        }
        .kartu h2 {
            font-size: 18px;
            margin-bottom: 5px;
            color: #ffffff;
        }
        .kartu p {
            font-size: 14px;
            color: #94a3b8;
        }
        .bawah {
            text-align: center;
            margin-top: 30px;
        }
        .panduan-link {
            color: #94a3b8;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 15px;
        }
        .panduan-link:hover {
            color: #facc15;
        }
        .kembali {
            color: #facc15;
            text-decoration: none;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Pilih Pasar</h1>
        <p class="sub-judul">Pilih salah satu untuk melihat grafik & sinyal AI</p>
    </header>

    <div class="kontainer">
        <a href="grafik.html?pasar=kripto" class="kartu">
            <h2>[ Kripto ]</h2>
            <p>Bitcoin, Ethereum & aset digital lainnya</p>
        </a>

        <a href="grafik.html?pasar=saham" class="kartu">
            <h2>[ Saham ]</h2>
            <p>Perusahaan terkemuka dunia</p>
        </a>

        <a href="grafik.html?pasar=forex" class="kartu">
            <h2>[ Forex ]</h2>
            <p>Pasar mata uang global</p>
        </a>
    </div>

    <div class="bawah">
        <a href="panduan.html" class="panduan-link">Baca Panduan Pengguna</a>
        <br><br>
        <a href="index.html" class="kembali">&larr; Kembali ke Beranda</a>
    </div>
</body>
</html>
