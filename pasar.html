<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Pasar - NMY Trading Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            min-height: 100vh;
            padding: 40px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 28px;
            color: #facc15;
            margin-bottom: 10px;
        }
        .sub-judul {
            font-size: 16px;
            color: #94a3b8;
        }
        .kontainer {
            max-width: 420px;
            margin: 0 auto;
        }
        .kartu {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(250, 204, 21, 0.2);
            border-radius: 12px;
            padding: 24px 20px;
            margin-bottom: 16px;
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
        }
        .kartu:hover {
            border-color: #facc15;
            background: rgba(250, 204, 21, 0.08);
            transform: translateY(-3px);
        }
        .kartu h2 {
            font-size: 20px;
            color: #facc15;
            margin-bottom: 8px;
        }
        .kartu p {
            font-size: 15px;
            color: #cbd5e1;
        }
        .bawah {
            text-align: center;
            margin-top: 40px;
        }
        .panduan-link {
            color: #94a3b8;
            font-size: 15px;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
            transition: color 0.3s;
        }
        .panduan-link:hover {
            color: #facc15;
        }
        .kembali {
            color: #60a5fa;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }
        .kembali:hover {
            color: #facc15;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>Pilih Pasar</h1>
        <p class="sub-judul">Pilih salah satu untuk melihat grafik & sinyal AI</p>
    </header>

    <div class="kontainer">
        <a href="grafik.html?pasar=kripto" class="kartu">
            <h2>📈 Kripto</h2>
            <p>Bitcoin, Ethereum & aset digital lainnya</p>
        </a>

        <a href="grafik.html?pasar=saham" class="kartu">
            <h2>📈 Saham</h2>
            <p>Indeks & Perusahaan Terkemuka Dunia</p>
        </a>

        <a href="grafik.html?pasar=forex" class="kartu">
            <h2>📈 Forex</h2>
            <p>Mata Uang Global</p>
        </a>
    </div>

    <div class="bawah">
        <a href="panduan.html" class="panduan-link">📖 Baca Panduan Pengguna</a>
        <br><br>
        <a href="index.html" class="kembali">&larr; Kembali ke Beranda</a>
    </div>
</body>
</html>
